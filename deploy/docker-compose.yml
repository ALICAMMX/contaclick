# Uso: docker compose -f deploy/docker-compose.yml --env-file /etc/contaclick/pruebas.env up -d --build
services:
  app:
    container_name: contaclick-pruebas-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_AUTH_PROVIDER: supabase
    env_file: /etc/contaclick/pruebas.env
    restart: unless-stopped
    mem_limit: 1g
    networks: [siapl_default]
networks:
  siapl_default:
    external: true
